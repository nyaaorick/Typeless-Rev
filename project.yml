name: Typeless-Rev

options:
  bundleIdPrefix: com.nyaaorick
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.32.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.4
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 1.1.0

targets:
  TypelessRev:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/InputIcon.pdf
      - path: Resources/AppIcon.icns
      - path: Resources/en.lproj/InfoPlist.strings
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
      - package: WhisperKit
        product: WhisperKit
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Typeless-Rev
        CFBundleDisplayName: Typeless-Rev
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Typeless-Rev"
        NSMicrophoneUsageDescription: "Typeless-Rev listens while you hold the push-to-talk key and turns your speech into text on this Mac."
        # InputMethodKit wiring. The connection name and controller class must
        # match AppDelegate / TypelessInputController.
        InputMethodConnectionName: TypelessRev_1_Connection
        InputMethodServerControllerClass: TypelessInputController
        InputMethodServerDelegateClass: TypelessInputController
        tsInputMethodIconFileKey: InputIcon.pdf
        tsInputMethodCharacterRepertoireKey: [Latn, Hans]
        # One mode, declared English: the input method starts in English and Chinese pinyin is a
        # switch inside it, so it is not filed under "Chinese, Simplified".
        ComponentInputModeDict:
          tsInputModeListKey:
            com.nyaaorick.inputmethod.TypelessRev.English:
              TISInputSourceID: com.nyaaorick.inputmethod.TypelessRev.English
              TISIntendedLanguage: en
              tsInputModeCharacterRepertoireKey: [Latn, Hans]
              tsInputModeDefaultStateKey: true
              tsInputModeIsVisibleKey: true
              tsInputModeMenuIconFileKey: InputIcon.pdf
              tsInputModePaletteIconFileKey: InputIcon.pdf
              tsInputModePrimaryInputModeKey: true
              tsInputModeScriptKey: smUnicodeScript
          tsVisibleInputModeOrderedArrayKey:
            - com.nyaaorick.inputmethod.TypelessRev.English
    settings:
      base:
        PRODUCT_NAME: Typeless-Rev
        PRODUCT_MODULE_NAME: TypelessRev
        PRODUCT_BUNDLE_IDENTIFIER: com.nyaaorick.inputmethod.TypelessRev
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging/TypelessRev-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/vendor/librime/dist/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/vendor/librime/dist/lib
        OTHER_LDFLAGS: -lrime
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: NO
        # The debug dylib split leaves an unsigned nested dylib that fails the bundle's signature check.
        ENABLE_DEBUG_DYLIB: NO
    postBuildScripts:
      - name: Bundle librime and Rime data
        script: '"$SRCROOT/scripts/bundle-rime.sh" "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"'
        basedOnDependencyAnalysis: false

  TypelessRevTests:
    type: bundle.unit-test
    platform: macOS
    # Pure logic only: Core has no dependency on librime or InputMethodKit, so
    # the tests compile it directly instead of hosting inside the IME app.
    sources:
      - path: Tests
      - path: Sources/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nyaaorick.inputmethod.TypelessRevTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TypelessRev:
    build:
      targets:
        TypelessRev: all
    test:
      targets:
        - TypelessRevTests
